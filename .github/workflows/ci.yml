name: CI (Continuous Integration)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: dummy
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Initialize Dummy Database
      if: env.HAS_DB == 'false'
      run: npx prisma db push
      env:
        HAS_DB: ${{ secrets.DATABASE_URL != '' }}
        DATABASE_URL: "postgresql://user:pass@localhost:5432/dummy"

    - name: Generate Prisma Client
      run: npx prisma generate
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://user:pass@localhost:5432/dummy' }}

    - name: Build Next.js app
      run: npm run build
      env:
        # Gunakan secrets jika ada, jika tidak (seperti PR dari fork), gunakan nilai dummy/lokal
        DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://user:pass@localhost:5432/dummy' }}
        DIRECT_URL: ${{ secrets.DIRECT_URL || 'postgresql://user:pass@localhost:5432/dummy' }}
        BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN || 'vercel_blob_rw_dummy1234567890dummy' }}
        ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'dummy_password' }}
        JWT_SECRET: ${{ secrets.JWT_SECRET || 'dummy_secret' }}
        NEXT_TELEMETRY_DISABLED: 1
