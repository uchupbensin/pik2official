version: '3.8'

services:
  db:
    image: postgres:15
    container_name: pik2-postgres-local
    restart: always
    environment:
      POSTGRES_USER: pik2user
      POSTGRES_PASSWORD: pik2password
      POSTGRES_DB: pik2db
    ports:
      - "5432:5432"
    volumes:
      - pik2_postgres_data:/var/lib/postgresql/data

volumes:
  pik2_postgres_data:
